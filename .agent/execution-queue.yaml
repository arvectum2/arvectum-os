    title: "Derived previews, text extraction and search/index projections"
    status: ready
    authority: AUTO
    independent: true
    auto_merge: true
    roadmap_priority: primary
    source: "docs/roadmap/ROADMAP.md#p1009--current-value-delivery-stream"
    dependencies:
      - P10.09-C
    objective: "Implement only bounded derived preview/extraction/search projections that improve ordinary asset use without creating a second source of truth."
    acceptance_criteria:
      - "Projection is explicitly non-authoritative and rebuildable from exact admitted source/version."
      - "Every result remains attributable to exact source/version and scoped by Organization/access/classification/purpose controls."
      - "Unsupported or failed extraction is explicit and fail-closed; no fabricated content or silent partial success."
      - "Derived output is non-Knowledge by default and does not create RFC-0007 promotion."
      - "Implementation remains inside current Accepted architecture/Product Contract scope and introduces no hidden platform/product dependency."
      - "Relevant deterministic tests, functional cross-review and exact-head CI/evidence pass before completion."
    executor_scope: "May inspect current Workspace asset flows, implement the smallest reversible slice, add tests/evidence, and factually synchronize roadmap/checkpoint status. Any RFC/ADR/Product Contract/lifecycle change downgrades to REVIEW/OWNER instead of being inferred."

