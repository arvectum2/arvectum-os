version: 2
repository: arvectum2/arvectum-os
mode: roadmap_executor

sources:
  current_task: .agent/current-task.yaml
  execution_queue: .agent/execution-queue.yaml
  canonical_roadmap: docs/roadmap/ROADMAP.md
  constitution: docs/constitution/CONSTITUTION.md
  rfc_index: docs/rfc/README.md
  company_authority:
    repository: arvectum2/arvectum-company
    decision: docs/governance/decisions/DECISION-2026-09-14-POS-004-ROADMAP-EXECUTOR-AM4.md
    assignment: docs/organization/POS-004-ROADMAP-EXECUTOR-AM4-AUTHORIZATION-v1.0.0.md

selection:
  resume_active_current_task_first: true
  scan_queue_in_order: true
  may_skip_blocked_or_human_gated_items: true
  may_execute_later_independent_items: true
  executor_may_reorder_queue: false
  executor_may_change_authority_class: false
  executor_may_create_new_priorities: false
  dependencies_must_be_satisfied: true

status_rules:
  executor_may_transition:
    - ready -> in_progress
    - in_progress -> blocked
    - blocked -> in_progress
    - in_progress -> done
  executor_must_not_change:
    - order
    - authority
    - dependencies
    - owner_gate
    - roadmap_priority
  done_requires_definition_of_done_and_evidence: true

lease:
  enabled: true
  ttl_minutes: 110
  renew_each_run: true
  reclaim_after_expiry_only_after_repository_activity_check: true
  manual_override_blocks_automation: true

company_authority_gate:
  required_for_automatic_merge: true
  authority_mode: AM-4
  position: POS-004
  principal: AI-ENG-001
  assignment_id: ASG-POS004-ROADMAP-EXECUTOR-2026-09-14
  mandatory_review_deadline: "2026-10-14"
  automatic_merge_counter_limit: 10
  fail_closed_if_authority_missing_unavailable_revoked_superseded_or_review_due: true
  fail_closed_mode: REVIEW
  product_or_repository_policy_cannot_expand_company_authority: true

authority:
  AUTO:
    description: "Low-risk, reversible implementation/evidence work already admitted by canonical Arvectum OS roadmap and higher authority."
    may:
      - inspect repository, PR, issue and CI state
      - create branches and pull requests
      - edit code, tests, non-normative documentation, CI and repository-owned evidence
      - make bounded reversible technical choices inside already-approved architecture and task acceptance criteria
      - run deterministic tests, diagnostics and cross-review
      - commit and push changes
      - update checkpoints and factual roadmap status/evidence when the underlying done gate is already satisfied
      - merge only when the queue item explicitly permits auto_merge and every merge gate is satisfied
  REVIEW:
    description: "Executor may prepare implementation, evidence and recommendation but an authorized human/owner must pass the final gate."
  OWNER:
    description: "Reserved decision. Automation may prepare analysis/drafts only and must never represent the decision as approved."
  HUMAN:
    description: "Requires physical, credentialed, legal, experiential or otherwise non-delegated human action."

governance_boundaries:
  never_auto_approve_or_change:
    - Constitution
    - Accepted RFC normative substance or status
    - Accepted ADR normative substance or status
    - Product Contract scope or lifecycle transition
    - Platform Capability lifecycle promotion
    - Decision Authority Policy approval
    - organizational authority or permissions
    - operational-readiness approval
    - public/external conformance, SLA, support or commercial commitments
  factual_sync_allowed_when_evidence_exists:
    - roadmap implementation status
    - review evidence
    - test and CI evidence
    - checkpoint state
  roadmap_sync_must_not:
    - invent new priority
    - reorder canonical work
    - widen scope
    - convert a waiting evidence gate into completed work
    - claim owner approval that did not occur

hard_stops:
  - synthesize P10.07 real-world evidence or owner dogfooding
  - replay a historical external effect without fresh authorization
  - change canonical state outside applicable Governed Execution
  - promote transient output or observation into validated Knowledge without RFC-0007 governance
  - weaken Organization/access/classification/purpose isolation
  - publish releases, packages or external production deployments without separate authority
  - create paid commitments, contracts, legal positions or external communications
  - expose or rotate secrets, private keys or sensitive company/customer data beyond admitted scope
  - bypass Company AM-4 review, expiry or revocation conditions

blocker_behavior:
  record_real_blocker: true
  release_lease_when_waiting_on_human: true
  continue_with_next_independent_ready_item: true
  notify_only_if_no_independent_executable_work_remains_or_owner_action_is_time_critical: true

notifications:
  report_every_run: true
  audit_issue: 6
  notify_on:
    - completed roadmap item
    - owner or human decision required and no independent executable work remains
    - material safety, security, legal or governance blocker
  routine_progress_goes_to_audit_issue: true
